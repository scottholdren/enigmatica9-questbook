<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enigmatica 9 Quests</title>
<meta name="description" content="Browse the Enigmatica 9 Expert quest book in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header class="brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1 id="pack-title">Quests</h1>
          <p class="brand-sub">Quest book</p>
        </div>
      </div>
      <div class="mode-toggle" role="radiogroup" aria-label="Pack mode">
        <button data-mode="normal" role="radio">Normal</button>
        <button data-mode="expert" role="radio">Expert</button>
      </div>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search quests, items…" autocomplete="off">
      </label>
    </header>
    <nav id="chapters" aria-label="Chapters"></nav>
    <div id="results" hidden></div>
  </aside>

  <main id="board">
    <div class="board-head">
      <button id="menu-btn" class="icon-btn" aria-label="Chapters">
        <svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="chapter-head">
        <img id="ch-icon" alt="">
        <div>
          <h2 id="ch-title"></h2>
          <p id="ch-sub"></p>
        </div>
      </div>
      <div class="zoom">
        <button class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="icon-btn" id="zoom-fit" aria-label="Fit to screen">
          <svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="icon-btn" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div id="viewport">
      <div id="canvas">
        <svg id="lines"></svg>
        <div id="nodes"></div>
      </div>
    </div>
    <p class="hint">Drag to pan · scroll to zoom · click a quest</p>
  </main>

  <section id="panel" aria-live="polite" hidden>
    <button id="panel-close" class="icon-btn" aria-label="Close">
      <svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="panel-body"></div>
  </section>
</div>
<div id="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
